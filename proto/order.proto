syntax = "proto3";

package micromart.order;

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}

message OrderItemInput {
  string product_id = 1;
  int32 quantity = 2;
}

message OrderItem {
  string product_id = 1;
  string product_name_snapshot = 2;
  double unit_price_snapshot = 3;
  int32 quantity = 4;
  double subtotal = 5;
}

message CreateOrderRequest {
  string user_id = 1;
  string idempotency_key = 2;
  repeated OrderItemInput items = 3;
}

message GetOrderRequest {
  string order_id = 1;
  string user_id = 2;
  string role = 3; // "customer" or "admin"
}

message ListOrdersRequest {
  string user_id = 1;
  string role = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// Shared response shape for CreateOrder/GetOrder. `found` is only meaningful
// on GetOrder (CreateOrder either succeeds or the call errors).
message OrderResponse {
  bool found = 1;
  string id = 2;
  string user_id = 3;
  string status = 4;
  double total_amount = 5;
  string currency = 6;
  repeated OrderItem items = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListOrdersResponse {
  repeated OrderResponse orders = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
