events {}

http {
  # Docker's embedded DNS (127.0.0.11) is what makes this dynamic: instead of
  # resolving "gateway" once when nginx starts (the normal behavior, which
  # would freeze in whatever replica count existed at that moment), the
  # `resolver` + variable combination below makes nginx re-resolve it every
  # 10 seconds. Each resolve can return multiple IPs — one per gateway
  # replica — and nginx round-robins across whatever it currently has. Scale
  # gateway up or down and this picks up the change on its own; no reload,
  # no restart.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location / {
      set $upstream http://gateway:3000;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
  }
}
